name: Import final Vault images once
on:
  push:
    branches:
      - chore/final-vault-images-only
    paths:
      - .github/workflows/vault-images-import-once.yml
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Extract verified original artwork and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:vault-replace-two-images.zip > "$RUNNER_TEMP/vault-replace-two-images.zip"
          printf '%s  %s\n' 'bd9c800238ce4f82416ce7c660e2c52e5b7b76fe96097174d9a543871843cd80' "$RUNNER_TEMP/vault-replace-two-images.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/vault-replace-two-images.zip" vault-replace-two-images/public/icons/anime_tracker_app_icon.png > public/icons/anime_tracker_app_icon.png
          unzip -p "$RUNNER_TEMP/vault-replace-two-images.zip" vault-replace-two-images/public/images/anime_tracker_loading_screen-1.png > public/images/anime_tracker_loading_screen-1.png
          printf '%s  %s\n' \
            '84e79d6a76c4902d7f79bb238f3927866e7158095fcf1cb3fc67d9652591c496' public/icons/anime_tracker_app_icon.png \
            '8b3a5d8a1b31355df413089178ad9fe3d73ff78dd085ec3a69445499ff975e84' public/images/anime_tracker_loading_screen-1.png | sha256sum -c -
          git rm -- .github/workflows/vault-images-import-once.yml
          git add -- public/icons/anime_tracker_app_icon.png public/images/anime_tracker_loading_screen-1.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace Vault PWA icon and loading image with exact final uploaded PNGs"
          git push origin HEAD:chore/final-vault-images-only
