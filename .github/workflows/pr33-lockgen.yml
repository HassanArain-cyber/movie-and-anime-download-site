name: Temporary lockfile regeneration for PR 33
on:
  push:
    branches: ["feat/background-web-push"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile without installing or running scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Output lockfile delta to the CI log
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const before = JSON.parse(execFileSync("git", ["show", "HEAD:package-lock.json"], { encoding:"utf8" }));
          const after = JSON.parse(fs.readFileSync("package-lock.json","utf8"));
          const changes = {};
          for (const [key,val] of Object.entries(after.packages)) {
            if (JSON.stringify(before.packages[key]) !== JSON.stringify(val)) changes[key] = val;
          }
          const removed = Object.keys(before.packages).filter(key => !(key in after.packages));
          console.log("PUSH_LOCK_DELTA_START");
          console.log(JSON.stringify({ changes, removed, version:after.lockfileVersion }));
          console.log("PUSH_LOCK_DELTA_END");
          NODE
